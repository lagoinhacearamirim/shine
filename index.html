<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrições - Conferência Shine 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Elementos Decorativos Holográficos de Fundo -->
    <div class="deco-bg deco-1"><img src="blackhole.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-2"><img src="laco.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-3"><img src="estela.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-4"><img src="lacoTexto.png" alt="" onerror="this.style.display='none'"></div>

    <main class="container">
        <!-- Cabeçalho / Logos -->
        <header class="header">
            <div class="logo-container">
                <img src="confLogo.png" alt="Conf Logo" class="conf-logo" onerror="this.style.display='none'">
                <img src="shineLogo.png" alt="Shine Logo" class="shine-logo" onerror="this.style.display='none'">
                <h1 class="brand-title">shine</h1>
            </div>
            <h2 class="section-title">INSCRIÇÕES ABERTAS</h2>
            
            <div class="date-badge">
                <span class="save-date-tag"><img src="estela.png" alt="" class="mini-star"> Save date</span>
                <p>05/12; Check-in às 14h</p>
            </div>
        </header>

        <!-- Formulário de Inscrição -->
        <form id="registration-form" class="form">
            <div class="input-group">
                <input type="text" id="name" name="name" placeholder="Nome completo" required autocomplete="name">
            </div>

            <div class="input-group">
                <input type="tel" id="tell" name="tell" placeholder="Telefone (WhatsApp)" required autocomplete="tel">
            </div>

            <!-- Seleção de Camisa -->
            <div class="shirt-selection-container">
                <label class="shirt-card" id="card-sim">
                    <input type="radio" name="camisa" value="sim" id="camisa-sim">
                    <div class="card-content">
                        <span class="card-text">Quero a camisa</span>
                        <div class="radio-indicator"></div>
                    </div>
                </label>

                <label class="shirt-card selected" id="card-nao">
                    <input type="radio" name="camisa" value="não" id="camisa-nao" checked>
                    <div class="card-content">
                        <span class="card-text">Não quero a camisa</span>
                        <div class="radio-indicator"></div>
                    </div>
                </label>
            </div>

            <!-- Link Ver a Camisa -->
            <div class="preview-link-container">
                <a href="#" id="view-shirt-btn" class="view-shirt-link">Ver a camisa</a>
            </div>

            <!-- Botões de Ação -->
            <div class="actions">
                <button type="button" id="btn-online" class="btn btn-primary">PAGAR ONLINE</button>
                <button type="button" id="btn-especie" class="btn btn-secondary">PAGAR EM ESPÉCIE</button>
            </div>

            <div class="existing-ticket-link">
                <a href="meu-ingresso.html">Já tenho um ingresso / Consultar status</a>
            </div>
        </form>
    </main>

    <!-- Modal para visualizar a camisa -->
    <div id="shirt-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Camisa Oficial Shine 2026</h3>
            <img src="camisa.png" alt="Camisa Oficial" class="shirt-modal-img" onerror="this.src='no.png'">
            <p>Design exclusivo holográfico e perolado.</p>
        </div>
    </div>

    <!-- Scripts Supabase e Principal -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
