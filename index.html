<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrições - Conferência Shine 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlay de Carregamento (Loader) -->
<div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(249, 246, 252, 0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
    <img src="lacoTexto.png" alt="Carregando..." class="loader-laco">
    <div class="loader-stars">
        <img src="estrela.png" alt="">
        <img src="estrela.png" alt="">
        <img src="estrela.png" alt="">
    </div>
</div>
    <!-- Elementos Decorativos Holográficos de Fundo -->
    <div class="deco-bg deco-no-top"><img src="no.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-laco-top"><img src="shineLogo.png" alt="" onerror="this.style.display='none'"></div>

    <!-- Estrelas Espalhadas (Pelo menos 6 instâncias) -->
    <div class="deco-bg deco-star star-1"><img src="estrela.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-star star-2"><img src="estrela.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-star star-3"><img src="estrela.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-star star-4"><img src="estrela.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-star star-5"><img src="estrela.png" alt="" onerror="this.style.display='none'"></div>
    <div class="deco-bg deco-star star-6"><img src="estrela.png" alt="" onerror="this.style.display='none'"></div>

    <main class="container">
        <!-- Cabeçalho / Logos -->
        <header class="header">
            <div class="logo-container">
                <img src="confLogo.png" alt="Conf Logo" class="conf-logo" onerror="this.style.display='none'">
            </div>
            <h2 class="section-title">CONFERÊNCIA LAÇOS 2026</h2>
            
            <button type="button" id="btn-programacao" class="date-badge" style="border: 1px solid var(--branco-perolado); cursor: pointer; text-align: center;">
                <div class="save-date-badge">Save<br>date</div>
                <p>PROGRAMAÇÃO</p>
            </button>
        </header>

        <!-- Formulário de Inscrição -->
        <form id="registration-form" class="form">
            <div class="input-group">
                <input type="text" id="name" name="name" placeholder="Nome completo" required autocomplete="name">
            </div>

            <div class="input-group">
                <input type="tel" id="tell" name="tell" placeholder="Telefone (WhatsApp)" required autocomplete="tel">
            </div>

            <!-- Seleção de Camisa -->
            <div class="shirt-selection-container">
                <label class="shirt-card" id="card-sim">
                    <input type="radio" name="camisa" value="sim" id="camisa-sim">
                    <div class="card-content">
                        <span class="card-text">Inscrição com Camisa (R$80)</span>
                        <div class="radio-indicator"></div>
                    </div>
                </label>

                <label class="shirt-card selected" id="card-nao">
                    <input type="radio" name="camisa" value="não" id="camisa-nao" checked>
                    <div class="card-content">
                        <span class="card-text">Somente inscrição (R$30)</span>
                        <div class="radio-indicator"></div>
                    </div>
                </label>
            </div>

            <!-- Dropdown do Tamanho da Camisa -->
            <div class="input-group" id="shirt-size-container" style="display: none;">
                <select id="tamanho-camisa" name="tamanho_camisa" style="width: 100%; padding: 1rem 1.5rem; border-radius: 999px; border: 1.5px solid var(--lilas-suave); background: rgba(255, 255, 255, 0.85); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; color: var(--texto-escuro); outline: none;">
                    <option value="" disabled selected>Selecione o tamanho da camisa</option>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>
                </select>
            </div>

            <!-- Link Ver a Camisa -->
            <div class="preview-link-container">
                <a href="#" id="view-shirt-btn" class="view-shirt-link">Ver a camisa</a>
            </div>

            <!-- Botões de Ação -->
            <div class="actions">
                <button type="button" id="btn-online" class="btn btn-primary">PAGAR ONLINE</button>
                <button type="button" id="btn-especie" class="btn btn-secondary">PAGAR EM ESPÉCIE</button>
            </div>

            <div class="existing-ticket-link">
                <a href="meu-ingresso.html">Já tenho um ingresso / Consultar status</a>
            </div>
        </form>
    </main>

    <!-- Elementos Inferiores Próximos ao Último Botão -->
    <div class="deco-bg deco-bottom-left"><img src="blackhole.png" alt="" onerror="this.style.display='none'"></div>
    <a href="https://wa.me/5584991501708?text=Ol%C3%A1%2C%20desejo%20patrocinar%20a%20confer%C3%AAncia%20Shine.%20O%20que%20%C3%A9%20necess%C3%A1rio%3F" target="_blank" class="btn-patrocinador">Seja um patrocinador</a>
    <div class="deco-bg deco-bottom-right"><img src="no.png" alt="" onerror="this.style.display='none'"></div>

    <!-- Modal para visualizar a camisa -->
    <div id="shirt-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>Camisa Oficial Shine 2026</h3>
            <img src="camisa.jpeg" alt="Camisa Oficial" class="shirt-modal-img" onerror="this.src='no.png'">
            <p><em>"Oséias 11:4"</em></p>
        </div>
    </div>

    <!-- Dialog da Programação -->
    <dialog id="programacao-dialog" style="border: none; border-radius: 20px; padding: 2rem; max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(74, 46, 93, 0.2); background: #ffffff; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif;">
        <h3 style="font-family: 'Playfair Display', serif; color: #4a2e5d; margin-top: 0; font-size: 1.5rem; margin-bottom: 1rem;">PROGRAMAÇÃO</h3>
        <ul style="list-style: none; padding: 0; margin: 0 0 1.5rem 0; color: #444; font-size: 0.95rem; line-height: 1.8; text-align: left;">
            <li><strong>14h</strong> - Início do check-in;</li>
            <li><strong>15h às 17h30</strong> - Sessão 1;</li>
            <li><strong>18h às 19h</strong> - Intervalo;</li>
            <li><strong>19h30</strong> - Sessão 2</li>
        </ul>
        <button id="programacao-btn-close" style="background-color: #4a2e5d; color: #ffffff; border: none; padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%;">Fechar</button>
    </dialog>
    
    <dialog id="especie-success-modal" style="border: none; border-radius: 20px; padding: 2rem; max-width: 400px; width: 90%; box-shadow: 0 10px 30px rgba(74, 46, 93, 0.2); background: #ffffff; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif;">
    <h3 style="font-family: 'Playfair Display', serif; color: #4a2e5d; margin-top: 0; font-size: 1.5rem;">Inscrição Realizada!</h3>
    <p id="especie-success-msg" style="color: #444; font-size: 0.95rem; line-height: 1.6; margin: 1.5rem 0;"></p>
    <button id="especie-btn-close" style="background-color: #4a2e5d; color: #ffffff; border: none; padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%;">OK, Ver Meu Ingresso</button>
</dialog>

    <!-- Scripts Supabase e Principal -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
