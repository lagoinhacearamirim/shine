<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Ingresso - Shine 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --lilas-profundo: #4a2e5d;
            --lilas-suave: #d4b5f0;
            --fundo-claro: #f9f6fc;
            --texto-principal: #2b2b2b;
            --branco: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--fundo-claro);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--branco);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(74, 46, 93, 0.08);
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            margin: 1rem;
        }

        .header .section-title {
            font-family: 'Playfair Display', serif;
            color: var(--lilas-profundo);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
            margin-top: 0;
        }

        .ticket-card {
            background: rgba(212, 181, 240, 0.12);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            text-align: left;
            border: 1.5px solid var(--lilas-suave);
        }

        .ticket-info {
            margin: 0.75rem 0;
            font-size: 0.95rem;
            color: #333;
            display: flex;
            justify-content: space-between;
        }

        .ticket-info strong {
            color: var(--lilas-profundo);
        }

        .ticket-code {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--lilas-profundo);
            text-align: center;
            background: var(--branco);
            padding: 0.75rem;
            border-radius: 12px;
            margin: 1.25rem 0 0.5rem 0;
            letter-spacing: 2px;
            border: 1px dashed var(--lilas-suave);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--lilas-profundo);
            color: var(--branco);
            margin-bottom: 0.75rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--lilas-profundo);
            border: 1.5px solid var(--lilas-profundo);
        }

        .btn-secondary:hover {
            background-color: rgba(74, 46, 93, 0.05);
        }

        .actions {
            margin-top: 1.75rem;
        }

        .status-badge {
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .status-pago { color: #0d8a4f; background: #e2f8ed; }
        .status-pendente { color: #b7791f; background: #fef3c7; }
        .status-especie { color: #2b6cb0; background: #ebf8ff; }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <h2 class="section-title">MEU INGRESSO</h2>
            <p>Conferência Shine 2026</p>
        </header>

        <div id="ticket-result"><form id="ticket-search-form" class="ticket-card" style="margin-top:1.5rem"><label id="search-label" for="search-value">Telefone (WhatsApp)</label><input id="search-value" required placeholder="Digite seu telefone" style="width:100%;box-sizing:border-box;padding:.9rem;margin:.6rem 0;border:1px solid var(--lilas-suave);border-radius:10px;font:inherit"><button id="search-submit" class="btn btn-primary" type="submit">Consultar ingresso</button><button id="toggle-search-mode" type="button" style="display:block;margin:.4rem auto;border:0;background:none;color:var(--lilas-profundo);text-decoration:underline;font-size:.78rem;cursor:pointer">Tentar pelo nome completo</button><p id="search-message" role="status"></p></form><div id="ticket-details"></div></div>

        <div class="actions">
            <button id="btn-download" class="btn btn-primary" style="display:none;">BAIXAR INGRESSO EM PDF</button>
            <a href="index.html" class="btn btn-secondary">Voltar ao Início</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
const SUPABASE_URL='https://xgnjkghwnqqekxyumzmh.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_v2Q-jBba3-V_fozjyyUieg_z-ZZmvyM';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const WEBHOOK_URL='https://xgnjkghwnqqekxyumzmh.supabase.co/functions/v1/infinitepay-webhook';
document.addEventListener('DOMContentLoaded',()=>{
 const form=document.getElementById('ticket-search-form'),input=document.getElementById('search-value'),label=document.getElementById('search-label'),toggle=document.getElementById('toggle-search-mode'),msg=document.getElementById('search-message'),details=document.getElementById('ticket-details'),download=document.getElementById('btn-download');
 let mode='phone',ticket=null,timer=null,busy=false;
 const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const money=v=>(Number(v||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 toggle.onclick=()=>{mode=mode==='phone'?'name':'phone';label.textContent=mode==='phone'?'Telefone (WhatsApp)':'Nome completo';input.type='text';input.inputMode=mode==='phone'?'tel':'text';input.placeholder=mode==='phone'?'Digite seu telefone':'Digite seu nome completo';toggle.textContent=mode==='phone'?'Tentar pelo nome completo':'Tentar pelo telefone';input.value='';msg.textContent='';input.focus();};
 function eventHtml(){return '<section class="ticket-card"><h3>Informações do evento</h3><div class="ticket-info"><span>Evento:</span><strong>Conferência Laços 2026</strong></div><div class="ticket-info"><span>Local:</span><strong>Lagoinha Ceará-Mirim / RN</strong></div><div class="ticket-info"><span>Data:</span><strong>05/12/2026</strong></div><div class="ticket-info"><span>Check-in:</span><strong>14h</strong></div><div class="ticket-info"><span>Sessão 1:</span><strong>15h às 17h30</strong></div><div class="ticket-info"><span>Intervalo:</span><strong>18h às 19h</strong></div><div class="ticket-info"><span>Sessão 2:</span><strong>19h30</strong></div></section>';}
 function render(d){
 ticket=d;
 const isShirtOnly=d.camisa==='somente';
 const shirt=d.camisa==='sim'?'Sim — tamanho '+esc(d.tamanho_camisa||'não informado'):'Não';
 const status=d.status==='pago'?'<span class="status-badge status-pago">PAGO ✅</span>':d.status==='pendente_especie'?'<span class="status-badge status-especie">PENDENTE — pagamento em espécie</span>':'<span class="status-badge status-pendente">PENDENTE ⏳</span>';
 if(isShirtOnly){
  details.innerHTML='<section class="ticket-card"><h3>CUPOM FISCAL</h3><div class="ticket-info"><span>Comprador:</span><strong>'+esc(d.name)+'</strong></div><div class="ticket-info"><span>Telefone:</span><strong>'+esc(d.tell)+'</strong></div><p style="text-align:center;font-weight:600;color:#4a2e5d;margin:1rem 0">Você não possui ingresso ainda.</p><div class="ticket-info"><span>Camisa escolhida:</span><strong>'+esc(d.tamanho_camisa||'não informado')+'</strong></div><img src="camisa.jpeg" alt="Camisa oficial da Conferência Shine 2026" style="display:block;width:100%;max-width:260px;height:auto;margin:1rem auto;border-radius:12px" onerror="this.style.display=\'none\'"><div class="ticket-info"><span>Valor:</span><strong>'+money(d.total||5500)+'</strong></div><div class="ticket-info"><span>Pagamento:</span><strong>'+status+'</strong></div><div id="payment-action" style="margin-top:1rem"></div><p id="payment-message" role="status"></p></section>';
 }else{
  details.innerHTML='<section class="ticket-card"><h3>Dados do participante</h3><div class="ticket-info"><span>Nome:</span><strong>'+esc(d.name)+'</strong></div><div class="ticket-info"><span>Telefone:</span><strong>'+esc(d.tell)+'</strong></div><div class="ticket-info"><span>Camisa:</span><strong>'+shirt+'</strong></div><div class="ticket-info"><span>Valor:</span><strong>'+money(d.total)+'</strong></div><div class="ticket-info"><span>Pagamento:</span><strong>'+status+'</strong></div><div class="ticket-code">'+esc(d.ingresso)+'</div><div id="payment-action" style="margin-top:1rem"></div><p id="payment-message" role="status"></p></section>'+eventHtml();
 }
 download.style.display=d.status==='pago'?'block':'none';
 download.textContent=isShirtOnly?'BAIXAR CUPOM FISCAL EM PDF':'BAIXAR INGRESSO EM PDF';
 if(d.status==='pago')download.onclick=()=>{
  const doc=new window.jspdf.jsPDF();
  doc.setFontSize(18);
  if(isShirtOnly){
   doc.text('CONFERÊNCIA LAÇOS 2026',105,20,{align:'center'});
   doc.setFontSize(14);doc.text('CUPOM FISCAL',105,30,{align:'center'});
   doc.setFontSize(11);doc.text('Comprovante de compra de camisa',105,38,{align:'center'});
   doc.text('Comprador: '+String(d.name||'').slice(0,70),20,55);
   doc.text('Telefone: '+String(d.tell||''),20,65);
   doc.text('Camisa escolhida: '+String(d.tamanho_camisa||'não informado'),20,75);
   doc.text('Valor pago: '+money(d.total||5500),20,85);
   doc.text('Status: PAGO',20,95);
   doc.text('Você não possui ingresso.',20,110);
   doc.save('Cupom-Fiscal-Camisa-Shine2026.pdf');
  }else{
   doc.text('CONFERÊNCIA LAÇOS 2026',105,20,{align:'center'});
   doc.setFontSize(12);doc.text('COMPROVANTE OFICIAL DE INSCRIÇÃO',105,29,{align:'center'});
   doc.text('Nome: '+String(d.name||'').slice(0,70),20,48);
   doc.text('Telefone: '+String(d.tell||''),20,58);
   doc.text('Camisa: '+shirt,20,68);
   doc.text('Valor pago: '+money(d.total),20,78);
   doc.text('Status: PAGO',20,88);
   doc.text('Local: Lagoinha Ceará-Mirim / RN',20,105);
   doc.text('Data: 05/12/2026 — Check-in: 14h',20,115);
   doc.text('Ingresso: '+String(d.ingresso||''),20,135);
   doc.save('Ingresso-Laços2026-'+d.ingresso+'.pdf');
  }
 };
 const action=document.getElementById('payment-action');
 if(d.status==='pendente'||d.status==='pendente_especie'){
  action.innerHTML='<button type="button" id="btn-pay" class="btn btn-primary">'+(d.status==='pendente_especie'?'Pagar online':'Pagar agora')+'</button>';
  document.getElementById('btn-pay').onclick=pay;
 }
 }
 async function pay(){if(!ticket||busy)return;busy=true;const btn=document.getElementById('btn-pay'),pm=document.getElementById('payment-message');btn.disabled=true;btn.textContent='Gerando pagamento...';try{const payload={handle:'nayannealmeidq',items:[{description:ticket.camisa==='somente'?'Camisa Oficial Shine 2026 ('+(ticket.tamanho_camisa||'')+')':ticket.camisa==='sim'?'Inscrição Conferência Laços 2026 + Camisa ('+(ticket.tamanho_camisa||'')+')':'Inscrição Conferência Laços 2026',quantity:1,price:Number(ticket.total)||(ticket.camisa==='somente'?5500:ticket.camisa==='sim'?8000:3000)}],order_nsu:String(ticket.order_nsu||ticket.id),webhook_url:WEBHOOK_URL,redirect_url:'https://lagoinhacearamirim.github.io/shine/meu-ingresso.html'};const r=await fetch('https://api.checkout.infinitepay.io/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Erro da InfinitePay: HTTP '+r.status);const j=await r.json(),url=j.url||j.link||(j.data&&j.data.url);if(!url)throw Error('Link de pagamento não retornado.');location.assign(url);}catch(e){pm.textContent=e.message||'Erro ao iniciar pagamento.';btn.disabled=false;btn.textContent=ticket.status==='pendente_especie'?'Pagar online':'Pagar agora';busy=false;}}
 async function refresh(){if(!ticket)return;const r=await supabaseClient.from('ingressos').select('*').eq('id',ticket.id).maybeSingle();if(!r.error&&r.data){const old=ticket.status;render(r.data);if(old!=='pago'&&r.data.status==='pago'){const p=document.getElementById('payment-message');if(p)p.textContent=r.data.camisa==='somente'?'Pagamento confirmado! Seu cupom fiscal está disponível.':'Pagamento confirmado! Seu ingresso está liberado.';}}}
 form.onsubmit=async e=>{e.preventDefault();const term=input.value.trim();if(!term)return;details.innerHTML='';download.style.display='none';ticket=null;if(timer)clearInterval(timer);msg.textContent='Consultando o ingresso...';const submit=document.getElementById('search-submit');submit.disabled=true;try{let q=supabaseClient.from('ingressos').select('*');if(mode==='phone'){const digits=term.replace(/\D/g,'');if(digits.length<8)throw Error('Digite um telefone válido com DDD.');q=q.eq('tell',Number(digits));}else{if(term.length<3)throw Error('Digite seu nome completo.');q=q.ilike('name',term.replace(/[%_,]/g,' ').replace(/\s+/g,' ').trim());}const r=await q.limit(10);if(r.error)throw r.error;if(!r.data||!r.data.length){msg.textContent='Nenhum ingresso ou compra encontrado. Confira os dados e tente novamente.';return;}if(r.data.length!==1){msg.textContent='Encontramos mais de uma inscrição ou compra. Selecione qual deseja consultar.';details.innerHTML='<section class="ticket-card"><h3>Resultados encontrados</h3>'+r.data.map((item,index)=>'<button type="button" class="btn btn-secondary" data-order-index="'+index+'" style="margin:.5rem 0">'+(item.camisa==='somente'?'Compra somente camisa — tamanho '+esc(item.tamanho_camisa||'não informado'):'Ingresso '+esc(item.ingresso||'')+' — '+esc(item.name))+' ('+money(item.total)+')</button>').join('')+'</section>';details.querySelectorAll('[data-order-index]').forEach(button=>button.addEventListener('click',()=>{msg.textContent='Compra localizada.';render(r.data[Number(button.dataset.orderIndex)]);if(timer)clearInterval(timer);if(ticket.status==='pendente'||ticket.status==='pendente_especie')timer=setInterval(refresh,5000);}));return;}msg.textContent='Registro localizado.';render(r.data[0]);if(ticket.status==='pendente'||ticket.status==='pendente_especie')timer=setInterval(refresh,5000);}catch(err){console.error(err);msg.textContent=err.message||'Não foi possível consultar o ingresso.';}finally{submit.disabled=false;}};
});
</script>
</body>
</html>
